<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page not found | ANTHE</title>
<link rel="icon" type="image/svg+xml" href="/godai-mark.svg">
<link rel="apple-touch-icon" href="/godai-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Hanken+Grotesk:wght@400;500&display=swap">
<style>
  :root {
    --ground: #D4D0C8;
    --band-dark: #C4C0B5;
    --band-light: #DEDAD2;
    --lift: rgba(234, 231, 224, 0.55);
    --ink: #1C1B19;
    --ink-hover: #37352F;
    --muted: #4F4C47;
    --rule: rgba(28, 27, 25, 0.45);
    --wash: rgba(28, 27, 25, 0.07);
    --serif: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
    --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --slant: -25deg; /* the lean of the ANTHE facets */
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #1D1C1A;
      --band-dark: #161513;
      --band-light: #272623;
      --lift: rgba(44, 42, 38, 0.6);
      --ink: #D8D4CB;
      --ink-hover: #E8E4DB;
      --muted: #A6A298;
      --rule: rgba(216, 212, 203, 0.45);
      --wash: rgba(216, 212, 203, 0.08);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #1D1C1A;
    --band-dark: #161513;
    --band-light: #272623;
    --lift: rgba(44, 42, 38, 0.6);
    --ink: #D8D4CB;
    --ink-hover: #E8E4DB;
    --muted: #A6A298;
    --rule: rgba(216, 212, 203, 0.45);
    --wash: rgba(216, 212, 203, 0.08);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: inherit; }

  html {
    height: 100%;
    background: var(--ground);
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  body {
    margin: 0;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 2.5rem 1.5rem;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Fluted-glass bands, same as the site hero and the loader */
  body::before {
    content: "";
    position: fixed;
    inset: -80px;
    z-index: 0;
    background-image: linear-gradient(90deg,
      var(--band-light) 0%, var(--band-dark) 9%, var(--band-light) 15%,
      var(--ground) 22%, var(--band-dark) 29%, var(--band-light) 36%,
      var(--band-dark) 41%, var(--ground) 50%, var(--band-light) 57%,
      var(--band-dark) 63%, var(--ground) 70%, var(--band-dark) 76%,
      var(--band-light) 84%, var(--ground) 91%, var(--band-light) 100%);
    background-size: max(100%, 1200px) 100%;
    background-repeat: repeat-x;
    filter: blur(28px);
    pointer-events: none;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    background: radial-gradient(closest-side at 50% 42%, var(--lift), transparent);
    pointer-events: none;
  }

  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 40rem;
  }

  /* ---------- The mark, one facet short ---------- */
  .mark {
    display: block;
    width: clamp(112px, 22vmin, 184px);
    height: auto;
    overflow: visible;
    margin-bottom: clamp(2.25rem, 6vh, 3.5rem);
    -webkit-tap-highlight-color: transparent;
  }
  .facet { fill: var(--ink); }

  .facet-a, .facet-b {
    animation: anthe-settle 1.1s var(--delay) both;
  }
  .facet-c {
    animation: anthe-falter 1.9s var(--delay) both;
  }
  .ghost {
    fill: none;
    stroke: var(--ink);
    stroke-opacity: 0.42;
    stroke-width: 1.4;
    stroke-dasharray: 5 4;
    animation: anthe-ghost 0.8s ease 1.8s both;
  }

  @keyframes anthe-settle {
    0%   { transform: translate(var(--hx), var(--hy)); animation-timing-function: cubic-bezier(0.22, 0.8, 0.25, 1); }
    78%  { transform: translate(var(--ox), var(--oy)); animation-timing-function: cubic-bezier(0.4, 0, 0.3, 1); }
    100% { transform: translate(0, 0); }
  }
  /* Rises halfway, sags, tries once more, then drops back out of sight */
  @keyframes anthe-falter {
    0%   { transform: translate(var(--hx), var(--hy)); animation-timing-function: cubic-bezier(0.2, 0.75, 0.3, 1); }
    32%  { transform: translate(calc(var(--hx) * 0.5), calc(var(--hy) * 0.5)); animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
    46%  { transform: translate(calc(var(--hx) * 0.57), calc(var(--hy) * 0.57)); animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
    60%  { transform: translate(calc(var(--hx) * 0.46), calc(var(--hy) * 0.46)); }
    70%  { transform: translate(calc(var(--hx) * 0.46), calc(var(--hy) * 0.46)); animation-timing-function: cubic-bezier(0.55, 0, 0.9, 0.45); }
    100% { transform: translate(var(--hx), var(--hy)); }
  }
  @keyframes anthe-ghost {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ---------- Copy ---------- */
  h1 {
    margin: 0 0 1rem;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(2.25rem, 1.6rem + 2.6vw, 3.25rem);
    line-height: 1.08;
    letter-spacing: -0.005em;
    text-wrap: balance;
  }
  .lede {
    margin: 0 0 2.25rem;
    max-width: 34ch;
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--muted);
    text-wrap: pretty;
  }
  .path {
    color: var(--ink);
    font-weight: 500;
    overflow-wrap: anywhere;
  }

  /* ---------- Actions: parallelograms at the logo's slant ---------- */
  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem 1.75rem;
  }
  .btn {
    position: relative;
    isolation: isolate;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    padding: 0 1.9rem;
    border: 0;
    background: none;
    color: var(--ink);
    font: 500 0.9375rem/1 var(--sans);
    letter-spacing: 0.01em;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn[hidden] { display: none; }
  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    transform: skewX(var(--slant));
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }
  .btn-primary { color: var(--ground); }
  .btn-primary::before { background: var(--ink); }
  .btn-primary:hover::before { background: var(--ink-hover); }
  .btn-quiet::before { border: 1px solid var(--rule); }
  .btn-quiet:hover::before { background: var(--wash); }
  .btn:focus-visible { outline: none; }
  .btn:focus-visible::after {
    content: "";
    position: absolute;
    inset: -5px;
    border: 2px solid var(--ink);
    transform: skewX(var(--slant));
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .facet-a, .facet-b { animation: none; transform: none; }
    .facet-c { animation: none; transform: translate(var(--hx), var(--hy)); }
    .ghost { animation: none; opacity: 1; }
    .btn::before { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <svg class="mark" id="mark" viewBox="0 0 227 197" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="anthe-floor-404">
          <rect x="-400" y="-400" width="1000" height="597"/>
        </clipPath>
      </defs>
      <path class="ghost" d="M192 92H227L179 197H144Z"/>
      <g clip-path="url(#anthe-floor-404)">
        <g class="facet facet-a" style="--delay:0.15s; --hx:-97px; --hy:197px; --ox:1.97px; --oy:-4px">
          <path d="M97 0H135L39 197H0Z"/>
        </g>
        <g class="facet facet-b" style="--delay:0.31s; --hx:0px; --hy:74px; --ox:0px; --oy:-4px">
          <path d="M91 123L123 197H58Z"/>
        </g>
        <g class="facet facet-c" style="--delay:0.5s; --hx:-48px; --hy:105px">
          <path d="M192 92H227L179 197H144Z"/>
        </g>
      </g>
    </svg>

    <h1>Page not found</h1>
    <p class="lede" id="lede">The link may be broken, or the page may have moved.</p>

    <nav class="actions" aria-label="Where to go next">
      <a class="btn btn-primary" href="/">Go to homepage</a>
      <button class="btn btn-quiet" type="button" id="back" hidden>Go back</button>
    </nav>
  </main>

<script>
(() => {
  // Name the address that wasn't found (from ?from= when redirected, else the current path)
  const lede = document.getElementById('lede');
  let path = new URLSearchParams(location.search).get('from') || location.pathname;
  try { path = decodeURI(path); } catch (e) {}
  const worthShowing = path && path.startsWith('/') && !/^\/(404(\.html)?|index\.html)?$/.test(path);
  if (worthShowing) {
    const span = document.createElement('span');
    span.className = 'path';
    span.textContent = path.length > 64 ? path.slice(0, 61) + '…' : path;
    lede.textContent = '';
    lede.append("There's nothing at ", span, '. The link may be broken, or the page may have moved.');
  }

  // Only offer "Go back" when there is somewhere to go back to
  const back = document.getElementById('back');
  if (history.length > 1) {
    back.hidden = false;
    back.addEventListener('click', () => history.back());
  }

  // Tap the mark to watch the last facet try again
  const mark = document.getElementById('mark');
  const parts = mark.querySelectorAll('.facet, .ghost');
  mark.addEventListener('click', () => {
    parts.forEach((el) => { el.style.animation = 'none'; });
    void mark.getBoundingClientRect();
    parts.forEach((el) => { el.style.animation = ''; });
  });
})();
</script>
</body>
</html>
