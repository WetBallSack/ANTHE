    <style>
      /* ANTHE loader */
      html.anthe-loading { overflow: hidden; }

      .anthe-loader {
        --ground: #D4D0C8;
        --band-dark: #C4C0B5;
        --band-light: #DEDAD2;
        --lift: rgba(234, 231, 224, 0.55);
        --ink: #1C1B19;
        --size: clamp(72px, 11vmin, 128px);
        --cycle: 3.4s;
        --stagger: 0.16s;

        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: var(--ground);
        overflow: hidden;
        transition: opacity 0.7s ease 0.1s;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .anthe-loader {
          --ground: #1D1C1A;
          --band-dark: #161513;
          --band-light: #272623;
          --lift: rgba(44, 42, 38, 0.6);
          --ink: #D8D4CB;
        }
      }
      :root[data-theme="dark"] .anthe-loader {
        --ground: #1D1C1A;
        --band-dark: #161513;
        --band-light: #272623;
        --lift: rgba(44, 42, 38, 0.6);
        --ink: #D8D4CB;
      }

      /* Fluted-glass bands, matching the site hero */
      .anthe-loader::before {
        content: "";
        position: absolute;
        inset: -80px;
        background-image: linear-gradient(90deg,
          var(--band-light) 0%, var(--band-dark) 9%, var(--band-light) 15%,
          var(--ground) 22%, var(--band-dark) 29%, var(--band-light) 36%,
          var(--band-dark) 41%, var(--ground) 50%, var(--band-light) 57%,
          var(--band-dark) 63%, var(--ground) 70%, var(--band-dark) 76%,
          var(--band-light) 84%, var(--ground) 91%, var(--band-light) 100%);
        background-size: max(100%, 1200px) 100%;
        background-repeat: repeat-x;
        filter: blur(28px);
      }
      .anthe-loader::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(closest-side at 50% 50%, var(--lift), transparent);
        pointer-events: none;
      }

      .anthe-loader .anthe-mark {
        position: relative;
        z-index: 1;
        display: block;
        width: var(--size);
        height: auto;
        overflow: visible;
        transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      /* Each facet slides along its own slant up through a hidden baseline */
      .anthe-loader .anthe-facet {
        fill: var(--ink);
        animation: anthe-cycle var(--cycle) calc(var(--i) * var(--stagger)) infinite both;
      }

      @keyframes anthe-cycle {
        0%   { transform: translate(var(--hx), var(--hy)); animation-timing-function: cubic-bezier(0.22, 0.8, 0.25, 1); }
        26%  { transform: translate(var(--ox), var(--oy)); animation-timing-function: cubic-bezier(0.4, 0, 0.3, 1); }
        33%  { transform: translate(0, 0); }
        64%  { transform: translate(0, 0); animation-timing-function: cubic-bezier(0.65, 0, 0.85, 0.35); }
        84%  { transform: translate(var(--hx), var(--hy)); }
        100% { transform: translate(var(--hx), var(--hy)); }
      }

      .anthe-loader.is-held .anthe-facet { animation: none; transform: none; }
      .anthe-loader.is-leaving { opacity: 0; pointer-events: none; }
      .anthe-loader.is-leaving .anthe-mark { transform: translateY(-10px); }

      .anthe-loader .anthe-sr {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
      }

      @media (prefers-reduced-motion: reduce) {
        .anthe-loader .anthe-facet { animation: none; transform: none; }
        .anthe-loader .anthe-mark { animation: anthe-breathe 2.4s ease-in-out infinite; transition: none; }
        .anthe-loader.is-leaving .anthe-mark { transform: none; }
        @keyframes anthe-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      }
    </style>

    <!-- ANTHE animated loader -->
    <div class="anthe-loader" id="anthe-loader" data-dismiss="manual" role="status" aria-live="polite">
      <svg class="anthe-mark" viewBox="0 0 227 197" aria-hidden="true" focusable="false">
        <defs>
          <clipPath id="anthe-floor">
            <rect x="-400" y="-400" width="1000" height="597"/>
          </clipPath>
        </defs>
        <g clip-path="url(#anthe-floor)">
          <g class="anthe-facet" style="--i:0; --hx:-97px; --hy:197px; --ox:1.97px; --oy:-4px">
            <path d="M97 0H135L39 197H0Z"/>
          </g>
          <g class="anthe-facet" style="--i:1; --hx:0px; --hy:74px; --ox:0px; --oy:-4px">
            <path d="M91 123L123 197H58Z"/>
          </g>
          <g class="anthe-facet" style="--i:2; --hx:-48px; --hy:105px; --ox:1.83px; --oy:-4px">
            <path d="M192 92H227L179 197H144Z"/>
          </g>
        </g>
      </svg>
      <span class="anthe-sr">Loading</span>

    <script>
    (() => {
      const loader = document.getElementById('anthe-loader');
      if (!loader) return;

      const root = document.documentElement;
      const leader = loader.querySelector('.anthe-facet');
      const facetCount = loader.querySelectorAll('.anthe-facet').length;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const styles = getComputedStyle(loader);
      const seconds = (prop, fallback) => {
        const raw = styles.getPropertyValue(prop).trim();
        const n = parseFloat(raw);
        if (!Number.isFinite(n)) return fallback;
        return raw.endsWith('ms') ? n / 1000 : n;
      };

      const CYCLE = seconds('--cycle', 3.4);
      const STAGGER = seconds('--stagger', 0.16);
      const HOLD_START = 0.335;   // matches the 33% keyframe
      const HOLD_END = 0.64;      // matches the 64% keyframe
      const MAX_WAIT_MS = 10000;  // failsafe: never block the site longer than this
      const PREVIEW_MS = /[?&]loader-preview(=|&|$)/.test(location.search) ? 6000 : 0;
      const startedAt = performance.now();
      let finishing = null;

      // Seconds into the current animation cycle, read from the first facet
      const cycleTime = () => {
        try {
          const anim = leader.getAnimations && leader.getAnimations()[0];
          if (anim && anim.currentTime !== null) return (anim.currentTime / 1000) % CYCLE;
        } catch (e) {}
        return ((performance.now() - startedAt) / 1000) % CYCLE;
      };

      // How long until every facet is fully up and settled
      const msUntilAssembled = () => {
        if (reduceMotion) return 0;
        const t = cycleTime();
        const settled = HOLD_START * CYCLE + (facetCount - 1) * STAGGER + 0.05;
        const sinking = HOLD_END * CYCLE;
        return (t <= sinking ? Math.max(0, settled - t) : CYCLE - t + settled) * 1000;
      };

      const finish = (resolve) => {
        loader.classList.add('is-held');
        setTimeout(() => {
          loader.classList.add('is-leaving');
          root.classList.remove('anthe-loading');
          let over = false;
          const cleanUp = () => {
            if (over) return;
            over = true;
            loader.remove();
            document.dispatchEvent(new CustomEvent('anthe:loaded'));
            resolve();
          };
          loader.addEventListener('transitionend', (e) => {
            if (e.target === loader && e.propertyName === 'opacity') cleanUp();
          });
          setTimeout(cleanUp, 1200);
        }, 380);
      };

      // Safe to call any number of times; always returns the same promise
      const done = () => {
        if (!finishing) {
          finishing = new Promise((resolve) => {
            const previewHold = Math.max(0, PREVIEW_MS - (performance.now() - startedAt));
            setTimeout(() => setTimeout(() => finish(resolve), msUntilAssembled()), previewHold);
          });
        }
        return finishing;
      };

      window.antheLoader = { done };
      setTimeout(done, MAX_WAIT_MS);

      // data-dismiss="load": hide after the page and its web fonts finish loading
      // data-dismiss="manual": your app calls window.antheLoader.done()
      if (loader.dataset.dismiss !== 'manual') {
        const fontsReady = () => (document.fonts ? document.fonts.ready : Promise.resolve());
        const auto = () => fontsReady().then(done, done);
        if (document.readyState === 'complete') auto();
        else window.addEventListener('load', auto, { once: true });
      }
    })();
    </script>
